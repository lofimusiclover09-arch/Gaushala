var SB=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
var TABLES=['donations','volunteers','animals','inventory','expenses','recurring'];
var MAP={donations:{no:'receipt_no',st:'status'},volunteers:{from:'from_time',to:'to_time'},inventory:{min:'min_qty'}};
function toDB(n,o){var m=MAP[n]||{},r={};Object.keys(o).forEach(function(k){if(k=='id'||k=='no'||o[k]===undefined)return;r[m[k]||k]=o[k]});return r}
function fromDB(n,r){var m=MAP[n]||{},o={};Object.keys(r).forEach(function(k){var j=k;Object.keys(m).forEach(function(a){if(m[a]==k)j=a});o[j]=r[k]});return o}
function nextNo(){return 'SVJG-'+new Date().getFullYear()+'-(auto)'}
function fail(r){if(r&&r.error){alert('Could not save: '+r.error.message);return true}return false}
function reload(n){return SB.from(n).select('*').order('id',{ascending:false}).then(function(r){if(!r.error)db[n]=r.data.map(function(x){return fromDB(n,x)})})}
function loadAll(){return Promise.all(TABLES.map(reload))}
function isAdmin(){return SB.rpc('is_admin').then(function(r){return r.data===true})}
function loadStats(){return SB.rpc('public_stats').then(function(r){if(r.data)PS=r.data}).catch(function(){})}
function sbAdd(n,o){return SB.from(n).insert(toDB(n,o)).select().single().then(function(r){return fail(r)?null:fromDB(n,r.data)})}
function add(e,n){e.preventDefault();var o={},f=e.target;CFG[n].c.forEach(function(c){var v=f.elements[c[0]].value;o[c[0]]=c[2]=='number'?+v:v});if(n=='donations'){o.pan=(o.pan||'').toUpperCase();o.st='Received'}sbAdd(n,o).then(function(){return reload(n)}).then(render);return false}
function del(n,id){if(!confirm('Delete this record?'))return;SB.from(n).delete().eq('id',id).then(function(r){fail(r);return reload(n)}).then(render)}
function saveEdit(e){e.preventDefault();var s=S.ed,f=e.target.elements,o={};CFG[s.n].c.forEach(function(c){var v=f[c[0]].value;o[c[0]]=c[2]=='number'?+v:(c[0]=='pan'?v.toUpperCase():v)});SB.from(s.n).update(toDB(s.n,o)).eq('id',s.id).then(function(r){fail(r);S.ed=null;return reload(s.n)}).then(render);return false}
function paid(id){var r=db.recurring.filter(function(x){return x.id==id})[0],d=new Date(r.due||today()),m={Monthly:1,Quarterly:3,Yearly:12}[r.freq]||1;d.setUTCMonth(d.getUTCMonth()+m);SB.from('recurring').update({due:d.toISOString().slice(0,10)}).eq('id',id).then(function(x){fail(x);return reload('recurring')}).then(render)}
function confirmD(id){SB.from('donations').update({status:'Received'}).eq('id',id).then(function(r){fail(r);return reload('donations')}).then(render)}
function gen(e){e.preventDefault();var d=draft();d.st='Received';sbAdd('donations',d).then(function(x){if(x)S.modal=x;return reload('donations')}).then(render);return false}
function pubDonate(e){e.preventDefault();var d={date:today(),donor:pf('pn').trim(),mobile:pf('pm'),mode:pf('po'),amount:+pf('pa'),purpose:pf('pp'),pan:pf('px').toUpperCase(),st:'Pledged'};SB.from('donations').insert(toDB('donations',d)).then(function(r){if(r.error){alert('Sorry, we could not submit this. Please check the details and try again.');return}S.md='\uD83D\uDE4F Thank you, '+esc(d.donor)+'! Your donation of '+inr(d.amount)+' is noted. The trust will contact you on '+esc(d.mobile)+' to confirm it and send your receipt on WhatsApp.';render();sc('donate')});return false}
function pubVol(e){e.preventDefault();var n=pf('vn').trim();SB.from('volunteers').insert(toDB('volunteers',{name:n,phone:pf('vm'),date:pf('vd'),from:pf('vf'),to:pf('vt'),task:pf('vw'),status:'Applied'})).then(function(r){if(r.error){alert('Sorry, we could not submit this. Please try again.');return}S.mv='\uD83D\uDE4F Thank you, '+esc(n)+'! Your application is received. The trust will contact you to confirm.';render();sc('volunteer')});return false}
function login(){return '<div class="wrap"><p><button class="btn o" onclick="S.view=\'home\';render()">\u2190 Home</button></p><h2>Admin log in</h2><div class="card" style="max-width:420px"><form onsubmit="return doLogin(event)"><label>Email</label><input name="u" type="email" required><label>Password</label><input name="p" type="password" required><p><button class="btn">Log in</button></p></form></div>'+(S.msg?'<p style="color:var(--bad)">'+S.msg+'</p>':'')+'</div>'}
function doLogin(e){e.preventDefault();var f=e.target.elements;SB.auth.signInWithPassword({email:f.u.value.trim(),password:f.p.value}).then(function(r){if(r.error){S.msg='Wrong email or password.';render();return}return isAdmin().then(function(ok){if(!ok){S.msg='This account is not an admin.';return SB.auth.signOut().then(render)}S.msg='';S.auth={role:'admin'};return loadAll().then(render)})});return false}
function logout(){SB.auth.signOut().then(function(){S.auth=null;S.tab='don';TABLES.forEach(function(n){db[n]=[]});render()})}
loadStats().then(function(){return SB.auth.getSession()}).then(function(r){if(r.data&&r.data.session)return isAdmin().then(function(ok){if(ok){S.auth={role:'admin'};return loadAll()}})}).catch(function(){}).then(render);
</script>
